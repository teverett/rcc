name: Platform Tests

# Runs after CI (ci.yml) finishes building rcc, so this workflow never
# builds rcc itself - it only downloads the already-built, already-
# bundled-with-its-own-runtime-libs artifact each of CI's macos/linux/
# windows jobs uploaded (rcc-macos/rcc-linux/rcc-windows) and exercises it
# as a compiler/linker against the example programs.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# Same reasoning as ci.yml's own concurrency block: a newer CI run on
# the same branch cancels whatever platform-tests run an older one on
# that branch already kicked off. Keyed off head_branch, not github.ref
# (meaningless on a workflow_run trigger), since that's the branch the
# triggering CI run actually built.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  platformtests:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            artifact: rcc-macos
          - name: linux
            os: ubuntu-latest
            artifact: rcc-linux
          - name: windows
            os: windows-latest
            artifact: rcc-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # examples.mk's default RCC path is build/bin/rcc(.exe), so
      # downloading straight into that directory (same filenames the
      # macos/linux/windows jobs in ci.yml uploaded) needs no override.
      # `run-id` pulls the artifact from the CI run that triggered this
      # workflow, since artifacts don't cross workflows on their own.
      - name: Download rcc binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: build/bin
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # actions/download-artifact doesn't preserve the executable bit.
      # (`shell:` can't itself depend on `matrix` - GitHub Actions
      # rejects that context there - so each OS gets its own literal-
      # shell step below instead of one step parameterized by it.)
      - name: Restore executable bit (macOS/Linux)
        if: matrix.name != 'windows'
        run: chmod +x build/bin/rcc

      # Only the i386-linux hello example needs this: rcc's hosted linker
      # resolves `-lc` against the real on-disk 32-bit libc (see
      # WindowsLinuxLinker.cpp's search paths), which Ubuntu doesn't ship
      # by default.
      - name: Install 32-bit libc (Linux target)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libc6-dev-i386

      # `make` and `python` cover every other example here - rcc.exe does its own codegen/
      # linking, and the i386-windows hello example only pulls in msvcrt.dll/kernel32.dll, both
      # present on any Windows machine; `python` is MSYS2's own package (providing the `python3`
      # this job's assertion scripts below run under this shell) - the windows-latest runner's
      # own system Python isn't on PATH inside the `msys2 {0}` shell. `gcc` is the one exception:
      # examples/vex/'s own `test` target builds the vendored vex interpreter
      # (tests/sim/vex/vex.c, plain C99) from source to run the compiled example under, needing
      # a real C compiler rather than anything rcc itself produces.
      - uses: msys2/setup-msys2@v2
        if: matrix.name == 'windows'
        with:
          msystem: UCRT64
          update: true
          install: >-
            python
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-gcc

      - name: Install py65 (6502 emulator)
        if: matrix.name == 'linux'
        run: pip3 install --break-system-packages py65

      - name: Install z80-python (Z80 emulator)
        if: matrix.name == 'linux'
        run: pip3 install --break-system-packages z80-python

      - name: Install qemu (68000 emulator)
        if: matrix.name == 'linux'
        run: sudo apt-get install -y --no-install-recommends qemu-system

      # No Ubuntu/Debian package ships the open-simh (4.x) fork the
      # pdp7-freestanding example needs - see ci.yml's own matching step
      # for why this builds the exact same upstream release the macOS
      # job's Homebrew formula does, straight from its own makefile.
      - name: Install open-simh (pdp7 emulator)
        if: matrix.name == 'linux'
        run: |
          git clone --branch v3.12-3 --depth 1 https://github.com/open-simh/simh.git /tmp/open-simh
          make -C /tmp/open-simh GCC=gcc CFLAGS_G=-fcommon all
          echo "/tmp/open-simh/BIN" >> "$GITHUB_PATH"

      - name: Install moarvm (moarvm interpreter)
        if: matrix.name == 'linux'
        run: sudo apt-get install -y --no-install-recommends moarvm

      # Each example's own `test` target builds it, then verifies it in
      # whichever simulator (py65, z80-python, qemu-system-m68k,
      # open-simh's pdp7) that target has one wired up for - see each
      # example's own Makefile/README for which. m30626fjpfp-freestanding/
      # 8086-msdos/6809-coco/6809-vectrex/tms9900-ti994a have no emulator
      # wired into this project at all, so their `test` targets only
      # confirm the build output exists.
      - name: Run example tests needing a target simulator
        if: matrix.name == 'linux'
        run: |
          make -C examples/m30626fjpfp-freestanding test
          make -C examples/8086-msdos test
          make -C examples/6809-coco test
          make -C examples/6809-vectrex test
          make -C examples/6502-freestanding test
          make -C examples/68000-freestanding test
          make -C examples/pdp7-freestanding test
          make -C examples/6502-dos33 test
          make -C examples/6502-vic20 test
          make -C examples/6502-c64 test
          make -C examples/6502-atari400 test
          make -C examples/6502-bbc test
          make -C examples/6502-atari2600 test
          make -C examples/6502-2a03 test
          make -C examples/z80-trs80 test
          make -C examples/z80-coleco test
          make -C examples/z80-zxspectrum test
          make -C examples/z80-cpc test
          make -C examples/z80-zx81 test
          make -C examples/z80-msx test
          make -C examples/z80-sms test
          make -C examples/z80-gamegear test
          make -C examples/8080-altair test
          make -C examples/8080-imsai test
          make -C examples/tms9900-ti994a test
          make -C examples/moarvm-hello test

      - name: Build and run macOS hello example
        if: matrix.name == 'macos'
        run: make -C examples/hosted-hello test

      - name: Build and run Linux hello example
        if: matrix.name == 'linux'
        run: make -C examples/hosted-hello test

      - name: Build and run Windows hello example
        if: matrix.name == 'windows'
        shell: msys2 {0}
        run: mingw32-make -C examples/hosted-hello test

      # Unlike the simulator-dependent examples above, examples/vex/'s own `test` target only
      # needs a real C compiler (to build the vendored reference interpreter it then runs the
      # compiled example under - tests/sim/vex/vex.c, plain C99, no dependencies), which every
      # OS here already has, so this runs everywhere rather than joining the macOS-only list.
      - name: Build and run vex example (macOS/Linux)
        if: matrix.name != 'windows'
        run: make -C examples/vex test

      - name: Build and run vex example (Windows)
        if: matrix.name == 'windows'
        shell: msys2 {0}
        run: mingw32-make -C examples/vex test CC=gcc
